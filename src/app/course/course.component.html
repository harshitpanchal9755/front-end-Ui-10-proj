<div align="center">
    <h1 *ngIf="!form.data.id" align="center" style="margin-bottom: 5px; color: navy">Add Course</h1>
    <h1 *ngIf="form.data.id>0" align="center" style="margin-bottom: 5px; color: navy">Update Course</h1>

    <div style="height: 20px; margin-bottom: 10px; text-align: center;">
        <h3 style="margin: 0; color: red;" *ngIf="!form.error && form.message">{{ form.message }}</h3>
        <h3 style="margin: 0; color: green;" *ngIf="form.error && form.message">{{ form.message }}</h3>
    </div>


    <table>

        <tr>
            <th align="left">Name<span style="color: red;">*</span></th>
            <td align="center"><input type="text" name="name" [(ngModel)]="form.data.name" placeholder="Enter the Course Name"></td>
            <td style="color: red;">{{form.inputerror.name}}</td>
        </tr>

        <tr>
            <th>Duration<span style="color: red;">*</span></th>
            <td>
                <select name="duration" [(ngModel)]="form.data.duration" style="width: 170px;">
                    <option value="undefined">----------Select----------</option>
                    <option [value]="1">1 Year</option>
                    <option [value]="2">2 Year</option>
                    <option [value]="3">3 Year</option>
                    <option [value]="4">4 Year</option>
                    <option [value]="5">5 Year</option>
                
                  </select>
              </td>

                    <td style="color: red;">{{form.inputerror.duration}}</td>
        </tr>

        <tr>
            <th align="left">Description<span style="color: red;">*</span></th>
            <td align="center"><textarea style="width: 167px;" name="description" rows="3" [(ngModel)]="form.data.description" placeholder="Enter the Description"></textarea></td>
            <td style="color: red;">{{form.inputerror.description}}</td>
        </tr>

        <tr>
            <th></th>
            <td align="left" colspan="2"><button (click)="submit()">save</button></td>
        </tr>

    </table>

</div>
